<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JPM DRAKZ</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background: linear-gradient(135deg,#001f4d,#0047ab,#007bff);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      color:white;
    }

    .container{
      width:90%;
      max-width:450px;
      background:rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:20px;
      padding:30px 20px;
      text-align:center;
      box-shadow:0 0 25px rgba(0,0,0,0.4);
      animation: muncul 1s ease;
    }

    @keyframes muncul{
      from{
        opacity:0;
        transform:translateY(40px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .logo{
      width:120px;
      height:120px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid white;
      margin-bottom:15px;
      box-shadow:0 0 20px rgba(255,255,255,0.5);
    }

    h1{
      font-size:32px;
      margin-bottom:10px;
      letter-spacing:2px;
    }

    p{
      font-size:14px;
      color:#e0e0e0;
      margin-bottom:25px;
    }

    .btn{
      display:block;
      width:100%;
      padding:14px;
      margin:12px 0;
      border:none;
      border-radius:12px;
      background:white;
      color:#0047ab;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
      text-decoration:none;
    }

    .btn:hover{
      transform:scale(1.05);
      background:#dce9ff;
    }

    .footer{
      margin-top:20px;
      font-size:12px;
      color:#cfcfcf;
    }

    .glow{
      position:absolute;
      width:300px;
      height:300px;
      background:#00aaff;
      border-radius:50%;
      filter:blur(120px);
      opacity:0.3;
      z-index:-1;
    }

    .glow1{
      top:-100px;
      left:-100px;
    }

    .glow2{
      bottom:-100px;
      right:-100px;
    }
  </style>
</head>
<body>

  <div class="glow glow1"></div>
  <div class="glow glow2"></div>

  <div class="container">

    <img src="https://files.catbox.moe/8h7m0m.jpg" class="logo">

    <h1>JPM DRAKZ</h1>

    <p>
      Jasa Promosi Murah & Berkualitas <br>
      Fast Respon • Aman • Trusted
    </p>

    <a href="#" class="btn" onclick="masukWA()">
      ORDER SEKARANG
    </a>

    <a href="#" class="btn">
      TESTIMONI
    </a>

    <a href="#" class="btn">
      LIST HARGA
    </a>

    <div class="footer">
      © 2026 JPM DRAKZ
    </div>

  </div>

  <script>
    function masukWA(){
      let nomor = "6283115843630";
      let pesan = "MIN MAU ORDER JPM";
      window.open(
        `https://wa.me/${nomor}?text=${encodeURIComponent(pesan)}`,
        "_blank"
      );
    }
  </script>

</body>
</html>
